name: licensing

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: licensing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d licensing"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: licensing
      RABBITMQ_DEFAULT_PASS: licensing
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: src/Licensing.Worker/Dockerfile
    environment:
      ConnectionStrings__licensing-db: "Host=postgres;Port=5432;Database=licensing;Username=postgres;Password=postgres"
      ConnectionStrings__messaging: "amqp://licensing:licensing@rabbitmq:5672"
      PhotoStorage__RootPath: /data/photos
    volumes:
      - photos:/data/photos
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/Licensing.Api/Dockerfile
    environment:
      ConnectionStrings__licensing-db: "Host=postgres;Port=5432;Database=licensing;Username=postgres;Password=postgres"
      ConnectionStrings__messaging: "amqp://licensing:licensing@rabbitmq:5672"
      PhotoStorage__RootPath: /data/photos
    ports:
      - "8080:8080"
    volumes:
      - photos:/data/photos
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      worker:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:
  photos: